<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>熔化凝固实验室</title><link rel="stylesheet" href="../common.css">
<style>
#cv{width:100%;background:#FFFDF7;border:3px solid #F2C27A;border-radius:16px;display:block}
.hud{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:bold}
.row{display:flex;gap:8px}.row .btn{margin:8px 0;font-size:18px;min-height:52px;padding:8px}
.state{text-align:center;font-size:22px;font-weight:bold;min-height:32px;margin:6px 0}
.hint{background:#FFF0D6;border-left:6px solid var(--orange);padding:10px;border-radius:10px;margin:8px 0}
.src{font-size:14px;color:#9a7a55}
@media (min-width:600px){.wrap{max-width:760px}body{font-size:20px}.opt{font-size:22px;min-height:64px}}
@media (min-width:900px) and (orientation:landscape){.wrap{max-width:1180px}.grid{display:grid;grid-template-columns:1.15fr 1fr;gap:20px;align-items:start}
 body{font-size:20px}.opt{font-size:22px;min-height:64px}#box{margin-top:0;position:sticky;top:10px}}
</style></head><body><div class="wrap">
<a class="back" href="index.html">← 返回物理岛</a>
<div class="hud"><span id="hearts"></span><span id="stage"></span><span id="coins"></span></div>
<div class="grid"><div id="lab"><h2>🔥 实验台：给三种物质加热</h2>
<canvas id="cv" width="680" height="420"></canvas>
<div class="state" id="state">选一种物质开始加热</div>
<div class="row"><button class="btn orange" onclick="run(0)">🧊 冰</button><button class="btn orange" onclick="run(1)">💎 海波</button><button class="btn orange" onclick="run(2)">🕯️ 石蜡</button></div>
</div>
<div class="card" id="box"></div></div></div>
<script src="../common.js"></script><script src="melt_lab_items.js"></script><script>
var $=function(i){return document.getElementById(i)};
/* ===== 实验：温度-时间图像 ===== */
var SUB=[{n:"冰",c:"#2a7bd5",t0:-10,mp:0,t1:10},{n:"海波",c:"#1E7B34",t0:30,mp:48,t1:60},{n:"石蜡",c:"#C01F1F",t0:30,mp:null,t1:70}];
var done={},timer=null,cv=$("cv"),g=cv.getContext("2d"),W=cv.width,H=cv.height,TMIN=-20,TMAX=80,TT=12;
function X(t){return 60+t/TT*(W-90)}function Y(T){return H-40-(T-TMIN)/(TMAX-TMIN)*(H-70)}
function temp(s,t){if(s.mp===null)return s.t0+(s.t1-s.t0)*t/TT;
 if(t<3)return s.t0+(s.mp-s.t0)*t/3; if(t<8)return s.mp; return s.mp+(s.t1-s.mp)*(t-8)/4;}
function st(s,t){if(s.mp===null)return t<1?"固态":t>10?"液态":"逐渐变软、变稀（温度一直在升高）";
 return t<3?"固态，温度升高":t<8?"固液共存：吸热，但温度保持 "+s.mp+"℃ 不变！":"液态，温度升高";}
function axes(){g.clearRect(0,0,W,H);g.strokeStyle="#3a2a1a";g.lineWidth=2;g.beginPath();g.moveTo(60,10);g.lineTo(60,H-40);g.lineTo(W-20,H-40);g.stroke();
 g.font="18px sans-serif";g.fillStyle="#3a2a1a";for(var T=-20;T<=80;T+=20){g.fillText(T,18,Y(T)+6);g.strokeStyle="#eee";g.beginPath();g.moveTo(60,Y(T));g.lineTo(W-20,Y(T));g.stroke();}
 g.fillText("温度/℃",64,24);g.fillText("时间/min",W-110,H-12);
 for(var k in done)curve(SUB[k],TT);}
function curve(s,tm){g.strokeStyle=s.c;g.lineWidth=4;g.beginPath();for(var t=0;t<=tm;t+=0.05){var x=X(t),y=Y(temp(s,t));t?g.lineTo(x,y):g.moveTo(x,y);}g.stroke();
 g.fillStyle=s.c;g.font="bold 18px sans-serif";g.fillText(s.n,X(tm)-30,Y(temp(s,tm))-10);}
function run(i){if(timer)return;var s=SUB[i],t=0;timer=setInterval(function(){t+=0.1;axes();curve(s,Math.min(t,TT));
 $("state").innerHTML=s.n+"："+st(s,Math.min(t,TT));if(t>=TT){clearInterval(timer);timer=null;done[i]=1;axes();
 if(Object.keys(done).length==3&&idx<0)start();}},40);}
axes();
/* ===== 关卡 ===== */
var LAB={kind:"实验题",src:"实验观察",why:"晶体熔化时吸热但温度不变，图像有水平段；非晶体熔化时温度一直升高，图像没有水平段。",q:"三条图像里，哪种物质没有固定的熔点？",opts:["冰","海波","石蜡","三种都有"],ans:2,
 hint:"晶体熔化时有一段温度不变的水平线（冰 0℃、海波 48℃）；石蜡的图像一直往上走，没有水平段，是非晶体。",
 v:{q:"变式：熔化图像中有一段水平线，说明这种物质是？",opts:["非晶体","晶体","液体","气体"],ans:1}};
var ITEMS=[LAB].concat(window.MELT_ITEMS);
var idx=-1,hearts=3,first=0,inV=false;
function hud(){$("hearts").textContent="❤️".repeat(hearts)+"🤍".repeat(3-Math.max(0,hearts));$("stage").textContent=idx<0?"实验":(idx+1)+"/"+ITEMS.length;$("coins").textContent="🪙 "+XXGame.totals().coins;}
$("box").innerHTML="<p>👉 先把<b>冰、海波、石蜡</b>都加热一遍，仔细看三条图像有什么不同，然后打怪开始！</p><button class='btn ghost' onclick='start()'>跳过实验，直接打怪</button>";
function start(){if(idx>=0)return;idx=0;show();}
function show(){hud();var it=ITEMS[idx],q=inV?it.v:it,h="";
 h+="<h2>"+(it.boss?"👹 ":"👾 ")+it.kind+(inV?"（变式复活）":"")+"</h2><div class='src'>来自："+it.src+"</div><p>"+q.q+"</p>";
 q.opts.forEach(function(o,i){h+="<button class='opt' id='o"+i+"' onclick='pick("+i+")'>"+"ABCD"[i]+". "+o+"</button>";});
 $("box").innerHTML=h;if(innerWidth<900)window.scrollTo(0,$("box").offsetTop-10);}
function pick(i){var it=ITEMS[idx],q=inV?it.v:it;for(var k=0;k<q.opts.length;k++)$("o"+k).disabled=true;
 if(i===q.ans){$("o"+i).className="opt right";XXGame.correct();if(!inV)first++;
  $("box").innerHTML+="<p class='ok'>✅ 打中了！+10🪙</p>"+(inV?"":"<div class='hint'>"+it.hint+"</div>")+"<button class='btn green' onclick='next()'>下一只 ➜</button>";}
 else{$("o"+i).className="opt wrong";hearts--;hud();XXGame.wrong();
  if(hearts<=0){over();return;}
  /* 严格自主：做错不标正确答案、不计分；只给引导，再出变式/再试 */
  $("box").innerHTML+="<p class='bad'>❌ 做错了，本题不计分，掉一颗心</p><div class='hint'><b>引导（不是本题答案）：</b><br>💡 "+it.hint+"</div>"+XXGame.whyCardHTML(card(it))+"<button class='btn ghost' onclick='listen()'>🔊 听晓伊老师讲</button>"+
   (inV?"<button class='btn orange' onclick='show()'>再试一次（仍无答案）➜</button><button class='btn green' onclick='next()'>先跳过，下一题 ➜</button>":"<button class='btn orange' onclick='inV=true;show()'>做变式题（无答案提示）➜</button>");}
 if(i!==q.ans&&hearts>0)XXGame.bindWhyCard($("box"),card(it));hud();}
function listen(){var it=ITEMS[idx],n=it===LAB?6:idx-1;try{new Audio("audio/melt_why"+n+".mp3").play();}catch(e){}}
function card(it){return {id:"physics:melt_lab:"+it.kind,"错因":it.why||"","概念":"",公式:""};}
function next(){inV=false;idx++;if(idx>=ITEMS.length)end();else show();}
function end(){var rate=first/ITEMS.length,stars=rate==1?3:rate>=0.67?2:1,r=XXGame.finish("physics","melt_lab",stars,rate);hud();
 $("box").innerHTML="<h2>🏆 实验室通关！</h2><p style='font-size:40px;text-align:center'>"+"⭐".repeat(stars)+"☆".repeat(3-stars)+"</p><p>一次答对 "+first+"/"+ITEMS.length+" 题，奖励 +"+r.bonus+"🪙</p>"+
 "<div class='hint'>📌 口诀：晶体有熔点，熔化凝固温不变；熔化吸热、凝固放热；熔点＝凝固点。</div><button class='btn orange' onclick='location.reload()'>再挑战一次</button><a class='btn green' href='index.html'>回物理岛</a>";}
function over(){$("box").innerHTML+="<h2>💔 三颗心用完了</h2><div class='hint'>"+ITEMS[idx].hint+"</div><button class='btn orange' onclick='location.reload()'>重新挑战</button>";}
hud();
</script></body></html>
