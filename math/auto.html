<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>错题小关</title><link rel="stylesheet" href="../common.css">
<style>.hud{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:bold;padding-right:52px}
.msg{min-height:28px;margin:8px 0;font-size:18px}.hint{background:#FFF0D6;border-left:6px solid var(--orange);padding:10px;border-radius:10px;margin:8px 0}
.tag{display:inline-block;color:#fff;border-radius:10px;padding:2px 10px;font-size:16px}</style></head><body><div class="wrap">
<a class="back" href="index.html">← 返回地图</a>
<div class="hud"><span id="hearts"></span><span id="stage"></span><span id="coins"></span></div>
<div class="grid"><div class="col1"><div class="card"><h2 id="ttl">错题小关</h2><p id="intro"></p></div></div><div class="card" id="box"></div></div></div>
<script src="../common.js"></script><script src="data.js"></script><script src="levels.js"></script><script src="chapters.js"></script><script src="auto_levels.js"></script>
<script>
(function(){var id=new URLSearchParams(location.search).get("lv"),L=(window.MATH_AUTO.levels||[]).filter(function(x){return x.id===id;})[0];
 if(!L){document.getElementById("box").innerHTML='<p>找不到这一关，<a href="index.html">返回地图</a></p>';return;}
 var ch=(window.MATH_CHAPTERS||[]).filter(function(c){return c.levels.indexOf(id)>=0;})[0];
 document.title=L.title;document.getElementById("ttl").textContent=L.icon+" "+(ch?ch.title+" · ":"")+L.title;
 document.getElementById("intro").textContent="本关 "+L.items.length+" 道错题本原题，每题后面跟一道变式题。原题做错扣 1 ❤️，看讲解卡后做对变式题可复活。";
 XXGame.selfQuiz({subject:"math",levelId:id,ids:L.items});})();
</script></body></html>
